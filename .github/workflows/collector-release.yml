name: Independent collector release

# Only immutable plugin tags build release packages. Ordinary PR/main checks
# remain in the registry-routed CI workflow; no extra full plugin matrix.
on:
  push:
    tags:
      - 'typescript-risk-v*'
      - 'http-json-contract-v*'
      - 'rust-source-risk-v*'
      - 'rust-measure-v*'
      - 'postgres-service-v*'

permissions:
  contents: read

concurrency:
  group: collector-release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  policy:
    name: Verify plugin release eligibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      plugin: ${{ steps.policy.outputs.plugin }}
      version: ${{ steps.policy.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Fetch protected main reference
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
      - name: Verify tag, plugin identity and exact successful main CI
        id: policy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 tools/release/plugin_release.py verify \
            --tag "$TAG" --commit "$COMMIT" --repository "$GITHUB_REPOSITORY" \
            --output target/release-policy.json --github-output "$GITHUB_OUTPUT"
      - name: Retain release policy evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: collector-policy-${{ github.run_id }}
          path: target/release-policy.json
          if-no-files-found: error
          retention-days: 90

  package:
    name: Package and accept ${{ needs.policy.outputs.plugin }}
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: needs.policy.outputs.plugin == 'typescript-risk' || needs.policy.outputs.plugin == 'http-json-contract'
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        if: needs.policy.outputs.plugin == 'rust-source-risk' || needs.policy.outputs.plugin == 'rust-measure' || needs.policy.outputs.plugin == 'postgres-service'
        with:
          toolchain: '1.97.1'
          components: llvm-tools-preview, rust-docs
      - name: Fetch and verify the pinned released Core contract
        run: python3 tools/release/pinned_core.py --output "$RUNNER_TEMP/core"
      - name: Test, package and accept the clean installed runtime
        env:
          PLUGIN: ${{ needs.policy.outputs.plugin }}
          RUST_SOURCE_TEST_EVIDENCE: ${{ runner.temp }}/collector-acceptance/source-risk
          HARNESS_GATE_POSTGRES_ACCEPTANCE: ${{ runner.temp }}/collector-acceptance/postgres
          HARNESS_GATE_TYPESCRIPT_ACCEPTANCE: ${{ runner.temp }}/collector-acceptance/typescript
        run: |
          set -euo pipefail
          python3 tools/release/package_plugin.py --plugin "$PLUGIN" \
            --core-root "$RUNNER_TEMP/core" --output dist
      - name: Retain fixed Core and acceptance evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: collector-acceptance-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/core/contract.json
            ${{ runner.temp }}/collector-acceptance
          if-no-files-found: error
          retention-days: 30
      - name: Stage only accepted package and SBOM
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: collector-release-assets-${{ github.run_id }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish signed independent collector
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [policy, package]
    environment: release
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: collector-release-assets-${{ github.run_id }}
          path: dist
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
      - name: Generate package release inventory
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          python3 tools/release/plugin_release.py inventory --dist dist \
            --tag "$TAG" --commit "$COMMIT" --repository "$REPOSITORY"
      - name: Generate checksum manifest from inventory
        run: |
          set -euo pipefail
          python3 tools/release/release_inventory.py checksums \
            --dist dist \
            --inventory dist/release-inventory.json

      - name: Install cosign
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a # v3.8.1

      - name: Sign release metadata
        run: |
          set -euo pipefail
          while IFS= read -r name; do
            cosign sign-blob --yes \
              --output-signature "dist/${name}.sig" \
              --output-certificate "dist/${name}.crt" \
              "dist/${name}"
          done < <(python3 tools/release/release_inventory.py list \
            --inventory dist/release-inventory.json --operation sign)

      - name: Verify release signatures from inventory
        run: |
          set -euo pipefail
          while IFS= read -r name; do
            cosign verify-blob \
              --signature "dist/${name}.sig" \
              --certificate "dist/${name}.crt" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/collector-release.yml@${GITHUB_REF}" \
              "dist/${name}"
          done < <(python3 tools/release/release_inventory.py list \
            --inventory dist/release-inventory.json --operation sign)

      - name: Prepare attestation subject set
        id: attestation-subjects
        run: |
          set -euo pipefail
          {
            echo 'subject_path<<GATEPROBES_SUBJECTS'
            while IFS= read -r name; do
              echo "dist/${name}"
            done < <(python3 tools/release/release_inventory.py list \
              --inventory dist/release-inventory.json --operation attest)
            echo 'GATEPROBES_SUBJECTS'
          } >> "$GITHUB_OUTPUT"

      - name: Attest inventory subjects
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: ${{ steps.attestation-subjects.outputs.subject_path }}

      - name: Verify provenance attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          while IFS= read -r name; do
            gh attestation verify "dist/${name}" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/collector-release.yml" \
              >/dev/null
          done < <(python3 tools/release/release_inventory.py list \
            --inventory dist/release-inventory.json --operation attest)

      - name: Verify exact release inventory
        run: |
          set -euo pipefail
          verify_args=(verify --dist dist --inventory dist/release-inventory.json)
          while IFS= read -r name; do
            verify_args+=(--attested "$name")
          done < <(python3 tools/release/release_inventory.py list \
            --inventory dist/release-inventory.json --operation attest)
          python3 tools/release/release_inventory.py "${verify_args[@]}"

      - name: Reverify the current tag and release eligibility before publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          # checkout may materialize an annotated event tag as a peeled local
          # ref. Fetch the remote object separately; never clobber immutable tags.
          remote_tag_ref=refs/release-verification/tag
          git fetch --no-tags origin main:refs/remotes/origin/main "refs/tags/$TAG:$remote_tag_ref"
          if [[ "$(git rev-parse "$remote_tag_ref^{commit}")" != "$COMMIT" ]]; then
            echo "remote release tag does not match expected commit" >&2
            exit 1
          fi
          python3 tools/release/plugin_release.py verify \
            --tag "$TAG" --commit "$COMMIT" --repository "$GITHUB_REPOSITORY" \
            --output target/release-policy-publish.json

      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.policy.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; refusing to overwrite it" >&2
            exit 1
          fi
          upload_paths=()
          while IFS= read -r name; do
            upload_paths+=("dist/${name}")
          done < <(python3 tools/release/release_inventory.py list \
            --inventory dist/release-inventory.json --operation upload)
          release_options=()
          if [[ "${VERSION%%+*}" == *-* ]]; then release_options+=(--prerelease); fi
          notes_args=(--generate-notes)
          notes_file="docs/releases/${TAG}.zh-CN.md"
          if [[ -f "$notes_file" ]]; then
            notes_args=(--notes-file "$notes_file")
          fi
          gh release create "$TAG" --verify-tag --target "$GITHUB_SHA" --latest=false "${notes_args[@]}" "${release_options[@]}" "${upload_paths[@]}"
