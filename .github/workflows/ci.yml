name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    name: Classify change
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_light: ${{ steps.classify.outputs.run_light }}
      run_plugins: ${{ steps.classify.outputs.run_plugins }}
      matrix: ${{ steps.classify.outputs.matrix }}
      summary: ${{ steps.classify.outputs.summary }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Classifier self-tests
        run: python3 -m unittest discover -s tools/ci/tests -v
      - name: Native installer integrity and lifecycle tests
        run: bash tools/install/tests/test_install.sh
      - name: Explicit plugin preparation and install lifecycle tests
        run: python3 -B -m unittest discover -s tools/onboarding -p 'test_*.py' -v
      - name: Runner migration self-tests
        run: python3 -m unittest discover -s tools/runners -p 'test_*.py' -v
      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE"; HEAD="${{ github.sha }}"
          elif [ "$EVENT_NAME" = "push" ]; then
            BASE="$PUSH_BEFORE"; HEAD="$PUSH_AFTER"
          else
            BASE=""; HEAD=""
          fi
          python3 tools/ci/classify.py --root . --base "$BASE" --head "$HEAD" \
            --github-output "$GITHUB_OUTPUT"

  lightweight:
    name: Lightweight checks
    needs: classify
    if: needs.classify.outputs.run_light == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check links, declarations and forbidden artifacts
        run: python3 tools/ci/check_docs.py
      - name: Offline runtime import (31 offline tests; joint acceptance runs separately)
        run: |
          python3 -B - <<'PYIMPORT'
          import unittest
          def flatten(suite):
              for item in suite:
                  if isinstance(item, unittest.TestSuite):
                      yield from flatten(item)
                  else:
                      yield item
          tests = list(flatten(unittest.defaultTestLoader.discover(
              'tools/runtime_import/tests', pattern='test_*.py')))
          separate = {'test_joint_core_main_capabilities_with_published_assets',
                        'test_published_assets_smoke_if_supplied'}
          excluded = [test for test in tests if test._testMethodName in separate]
          required = [test for test in tests if test._testMethodName not in separate]
          if len(tests) != 33 or len(required) != 31 or {test._testMethodName for test in excluded} != separate or len(excluded) != 2:
              raise SystemExit('runtime import test inventory changed')
          print('Separate required job: joint installed acceptance; local-only: published-assets smoke')
          result = unittest.TextTestRunner(verbosity=2).run(unittest.TestSuite(required))
          if result.testsRun != 31 or result.skipped or result.expectedFailures or not result.wasSuccessful():
              raise SystemExit('required runtime import tests failed or skipped')
          PYIMPORT

  runtime-importer:
    name: Standalone runtime importer acceptance
    needs: classify
    if: needs.classify.outputs.run_light == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Fetch independently pinned released inputs
        run: python3 tools/release/importer_core.py --output "$RUNNER_TEMP/importer-core"
      - name: Distribution tests (55, no skips)
        env:
          GATEHOUSE_CORE: ${{ runner.temp }}/importer-core/bin/harness-gate-linux-amd64
          RUNTIME_IMPORT_ASSETS: ${{ runner.temp }}/importer-core/runtime-assets
        run: |
          python3 - <<'PYIMPORTER'
          import unittest
          suite = unittest.defaultTestLoader.discover('plugins/runtime-importer/tests_package')
          assert suite.countTestCases() == 55
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.testsRun == 55 and not result.skipped and not result.expectedFailures and result.wasSuccessful()
          PYIMPORTER
      - name: Package and accept extracted importer
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/importer-home"
          export HOME="$RUNNER_TEMP/importer-home"
          python3 - <<'PYLEGACY'
          import os, sys, tempfile
          from pathlib import Path
          sys.path[:0] = ['tools/release', 'plugins/runtime-importer/tests_package']
          import legacy_fixture, package_importer
          with tempfile.TemporaryDirectory() as temp:
              root = legacy_fixture.create(Path.cwd(), Path(temp) / 'legacy-fixture')
              output = Path(os.environ['RUNNER_TEMP']) / 'importer-dist'
              output.mkdir()
              core = Path(os.environ['RUNNER_TEMP']) / 'importer-core'
              package_importer.package(root, output, core, core / 'runtime-assets')
          PYLEGACY

  runtime-import-v3:
    name: V3 importer installed readiness acceptance
    needs: classify
    if: needs.classify.outputs.run_light == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Fetch pinned Core0.9 and released readiness0.2
        run: python3 tools/release/importer_core_v3.py --output "$RUNNER_TEMP/importer-v3-core"
      - name: Package and externally verify candidate importer before installed readiness
        env:
          HARNESS_GATE_IMPORTER_ACCEPTANCE: ${{ runner.temp }}/importer-v3-evidence
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache"
          chmod 700 "$HOME" "$HOME/.cache"
          python3 - <<'PYREADINESS'
          import os, sys, tempfile
          from pathlib import Path
          sys.path.insert(0, 'tools/release')
          import importer_readiness_fixture, package_importer
          with tempfile.TemporaryDirectory() as temp:
              root = importer_readiness_fixture.create(Path.cwd(), Path(temp) / 'fixture')
              output = Path(os.environ['RUNNER_TEMP']) / 'importer-v3-dist'
              output.mkdir()
              core = Path(os.environ['RUNNER_TEMP']) / 'importer-v3-core'
              # Harness stays in trusted checkout; extracted bytes come from historical fixture.
              archive = package_importer.build(root, output)
              import subprocess, hashlib
              sbom = Path(str(archive) + '.sbom.cdx.json')
              subprocess.run(['python3', 'tools/release/accept_importer_v3.py', '--archive', str(archive), '--sbom', str(sbom),
                  '--archive-sha256', hashlib.sha256(archive.read_bytes()).hexdigest(), '--sbom-sha256', hashlib.sha256(sbom.read_bytes()).hexdigest(),
                  '--core', str(core / 'bin/harness-gate-linux-amd64'), '--assets', str(core / 'runtime-assets'),
                  '--report', str(output / 'acceptance.json')], check=True)
          PYREADINESS
      - name: Retain importer v3 contract package and acceptance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: importer-v3-acceptance
          path: |
            ${{ runner.temp }}/importer-v3-core/contract.json
            ${{ runner.temp }}/importer-v3-dist
            ${{ runner.temp }}/importer-v3-evidence
          if-no-files-found: error

  runtime-import-lifecycle:
    name: Lifecycle importer service acceptance
    needs: classify
    if: needs.classify.outputs.run_light == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Fetch pinned Core0.10 and released lifecycle0.1
        run: python3 tools/release/importer_core_lifecycle.py --output "$RUNNER_TEMP/importer-lifecycle-core"
      - name: Package and externally verify candidate importer before installed lifecycle
        env:
          HARNESS_GATE_IMPORTER_ACCEPTANCE: ${{ runner.temp }}/importer-lifecycle-evidence
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache"
          chmod 700 "$HOME" "$HOME/.cache"
          python3 - <<'PYLIFECYCLEFIXTURE'
          import os, sys, tempfile
          from pathlib import Path
          sys.path.insert(0, 'tools/release')
          import importer_lifecycle_fixture, package_importer
          with tempfile.TemporaryDirectory() as temp:
              root = importer_lifecycle_fixture.create(Path.cwd(), Path(temp) / 'fixture')
              output = Path(os.environ['RUNNER_TEMP']) / 'importer-lifecycle-dist'
              output.mkdir()
              core = Path(os.environ['RUNNER_TEMP']) / 'importer-lifecycle-core'
              # Harness stays in trusted checkout; extracted bytes come from historical fixture.
              archive = package_importer.build(root, output)
              import subprocess, hashlib
              sbom = Path(str(archive) + '.sbom.cdx.json')
              subprocess.run(['python3', 'tools/release/accept_importer_lifecycle.py', '--archive', str(archive), '--sbom', str(sbom),
                  '--archive-sha256', hashlib.sha256(archive.read_bytes()).hexdigest(), '--sbom-sha256', hashlib.sha256(sbom.read_bytes()).hexdigest(),
                  '--core', str(core / 'bin/harness-gate-linux-amd64'), '--assets', str(core / 'runtime-assets'),
                  '--report', str(output / 'acceptance.json')], check=True)
          PYLIFECYCLEFIXTURE
      - name: Retain importer lifecycle contract package and acceptance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: importer-lifecycle-acceptance
          path: |
            ${{ runner.temp }}/importer-lifecycle-core/contract.json
            ${{ runner.temp }}/importer-lifecycle-dist
            ${{ runner.temp }}/importer-lifecycle-evidence
          if-no-files-found: error

  runtime-import-podman:
    name: Podman importer capture acceptance
    needs: classify
    if: needs.classify.outputs.run_light == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Fetch pinned Core0.11 and released Podman0.1
        run: python3 tools/release/importer_core_podman.py --output "$RUNNER_TEMP/importer-podman-core"
      - name: Package and externally verify candidate importer before installed Podman
        env:
          HARNESS_GATE_IMPORTER_ACCEPTANCE: ${{ runner.temp }}/importer-podman-evidence
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache"
          chmod 700 "$HOME" "$HOME/.cache"
          python3 tools/release/package_plugin.py --plugin runtime-importer --core-root "$RUNNER_TEMP/importer-podman-core" --output "$RUNNER_TEMP/importer-podman-dist"
      - name: Retain importer Podman contract package and acceptance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: importer-podman-acceptance
          path: |
            ${{ runner.temp }}/importer-podman-core/contract.json
            ${{ runner.temp }}/importer-podman-dist
            ${{ runner.temp }}/importer-podman-evidence
          if-no-files-found: error

  runtime-import-joint:
    name: Installed runtime joint acceptance
    needs: classify
    if: needs.classify.outputs.run_light == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: musutrade/GateHouse
          ref: a4e6dba7b2d6ad06336c67e79d1132eb96a5bab7
          path: core-installed-pin
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.99.1'
      - name: Build exact Core source and download pinned runtime inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git -C core-installed-pin rev-parse HEAD)" = a4e6dba7b2d6ad06336c67e79d1132eb96a5bab7
          test -z "$(git -C core-installed-pin status --porcelain --untracked-files=no)"
          cargo build --locked --manifest-path core-installed-pin/tools/harness-gate/Cargo.toml --bin harness-gate --target-dir "$RUNNER_TEMP/installed-core-target"
          mkdir -m 700 "$RUNNER_TEMP/runtime-import-assets"
          gh release download docker-runtime-v0.1.1 --repo musutrade/GateProbes --dir "$RUNNER_TEMP/runtime-import-assets" \
            --pattern gateprobes-docker-runtime-0.1.1-linux-amd64.tar.gz \
            --pattern gateprobes-docker-runtime-0.1.1-linux-amd64.tar.gz.sbom.cdx.json \
            --pattern release-inventory.json --pattern SHA256SUMS
          sha256sum core-installed-pin/tools/harness-gate/Cargo.lock "$RUNNER_TEMP/installed-core-target/debug/harness-gate"
      - name: Required installed-host acceptance (1 test, no skips)
        env:
          GATEHOUSE_CORE_SOURCE: ${{ github.workspace }}/core-installed-pin
          GATEHOUSE_CORE_MAIN: ${{ runner.temp }}/installed-core-target/debug/harness-gate
          RUNTIME_IMPORT_ASSETS: ${{ runner.temp }}/runtime-import-assets
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/runtime-import-home"
          export HOME="$RUNNER_TEMP/runtime-import-home"
          python3 tools/runtime_import/run_joint.py

  runtime-wire:
    name: Runtime v2 wire acceptance (${{ matrix.runner }})
    needs: classify
    if: needs.classify.outputs.run_light == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Python runtime toolchain
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
      - name: Python runtime adapter tests (51, no skips)
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import unittest

          suite = unittest.defaultTestLoader.discover(
              'plugins/docker-runtime/tests', pattern='test_*.py')
          count = suite.countTestCases()
          if count != 51:
              raise SystemExit(f'expected 51 runtime adapter tests, discovered {count}')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.testsRun != 51:
              raise SystemExit(f'expected 51 executed runtime adapter tests, ran {result.testsRun}')
          if result.skipped:
              raise SystemExit(f'skipped runtime adapter tests are not allowed: {result.skipped}')
          if result.expectedFailures:
              raise SystemExit(f'expected failures are not allowed: {result.expectedFailures}')
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Rust 24 acceptance against pinned Core
        working-directory: tests/runtime-v2-wire
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/runtime-v2-wire-target
        run: ./scripts/run-acceptance.sh
      - name: Install pinned runtime packaging toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy, rust-docs
          targets: x86_64-unknown-linux-musl
      - name: Native runtime format and lint (Linux)
        working-directory: plugins/docker-runtime/native
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --locked --target x86_64-unknown-linux-musl --all-targets -- -D warnings
      - name: Native runtime tests (45, no skips)
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/runtime-native-tests-target
        run: ./tests/runtime-native-host/scripts/run-native-tests.sh
      - name: Native actual-host acceptance against fixed Core
        run: ./tests/runtime-native-host/scripts/run-acceptance.sh
      - name: Native runtime package regressions (34, no skips)
        run: |
          python3 -B - <<'PYTEST'
          import unittest
          suite = unittest.defaultTestLoader.discover(
              'plugins/docker-runtime/tests_package', pattern='test_*.py')
          if suite.countTestCases() != 34:
              raise SystemExit('expected 34 native runtime package regressions')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.testsRun != 34 or result.skipped or result.expectedFailures:
              raise SystemExit('incomplete native runtime package regressions')
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PYTEST
      # Released Core 0.9.0 requires the newer Ubuntu24 loader.
      # Keep its strict acceptance on Ubuntu24; both builders still must agree.
      - name: Build native runtime reproducibility evidence (no Core acceptance)
        if: matrix.runner == 'ubuntu-22.04'
        run: |
          python3 - <<'PYBUILD'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools/release')
          import package_runtime
          output = Path(os.environ['RUNNER_TEMP']) / 'runtime-package-output'
          output.mkdir()
          package_runtime.build(Path.cwd(), output, "docker-readiness")
          PYBUILD
      - name: Package and accept extracted native runtime with released Core
        env:
          HARNESS_GATE_RUNTIME_ACCEPTANCE: ${{ runner.temp }}/readiness-acceptance
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache"
          chmod 700 "$HOME" "$HOME/.cache"
          python3 tools/release/readiness_core.py --output "$RUNNER_TEMP/runtime-package-core"
          python3 tools/release/package_plugin.py --plugin docker-readiness             --core-root "$RUNNER_TEMP/runtime-package-core"             --output "$RUNNER_TEMP/runtime-package-output"

      - name: Retain readiness Core contract and extracted acceptance
        if: always() && matrix.runner == 'ubuntu-24.04'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: readiness-acceptance
          path: |
            ${{ runner.temp }}/runtime-package-core/contract.json
            ${{ runner.temp }}/readiness-acceptance
          if-no-files-found: error

      - name: Retain exact runtime packages for independent comparison
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-package-${{ matrix.runner }}
          path: ${{ runner.temp }}/runtime-package-output/*
          if-no-files-found: error

  runtime-repro:
    name: Compare independent native runtime packages
    needs: [classify, runtime-wire]
    if: needs.classify.outputs.run_light == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: runtime-package-*
          path: packages
      - name: Require identical archive and SBOM from both runner images
        run: |
          python3 - <<'PYCOMPARE'
          from pathlib import Path
          import hashlib
          root = Path('packages')
          expected = {'runtime-package-ubuntu-22.04', 'runtime-package-ubuntu-24.04'}
          if {p.name for p in root.iterdir()} != expected:
              raise SystemExit('independent runtime build evidence missing')
          inventories = []
          for name in sorted(expected):
              files = list((root / name).iterdir())
              if len(files) != 2 or not all(p.is_file() and not p.is_symlink() for p in files):
                  raise SystemExit('invalid runtime package evidence')
              archive = 'gateprobes-docker-readiness-0.2.0-linux-amd64.tar.gz'
              if {p.name for p in files} != {archive, archive + '.sbom.cdx.json'}:
                  raise SystemExit('archive or SBOM missing')
              inventories.append({p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in files})
          if inventories[0] != inventories[1]:
              raise SystemExit('independent runtime archive/SBOM differ')
          print(inventories[0])
          PYCOMPARE

  plugins:
    name: Plugin checks (${{ matrix.plugin }})
    needs: classify
    if: needs.classify.outputs.run_plugins == 'true'
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.classify.outputs.matrix) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Python toolchain
        if: contains(matrix.toolchains, 'python')
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Rust toolchain
        if: contains(matrix.toolchains, 'rust')
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ matrix.rust_toolchain }}
          components: ${{ matrix.rust_components }}

      - name: Install native runtime musl target
        if: matrix.plugin == 'docker-runtime' || matrix.plugin == 'docker-lifecycle' || matrix.plugin == 'podman-lifecycle'
        run: rustup target add --toolchain 1.99.1 x86_64-unknown-linux-musl

      # Cargo cache for Rust plugins
      - name: Cache Cargo registry and git
        if: contains(matrix.toolchains, 'rust')
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ matrix.rust_toolchain }}-${{ hashFiles(format('{0}/**/Cargo.lock', matrix.path)) }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.rust_toolchain }}-
            ${{ runner.os }}-cargo-

      # Cargo build cache
      - name: Cache Cargo build
        if: contains(matrix.toolchains, 'rust')
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
        with:
          path: ${{ matrix.path }}/target
          key: ${{ runner.os }}-cargo-build-${{ matrix.plugin }}-${{ matrix.rust_toolchain }}-${{ hashFiles(format('{0}/**/Cargo.lock', matrix.path)) }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-${{ matrix.plugin }}-${{ matrix.rust_toolchain }}-
            ${{ runner.os }}-cargo-build-${{ matrix.plugin }}-

      # TypeScript/Node.js cache
      - name: Cache npm dependencies
        if: contains(matrix.toolchains, 'typescript')
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-24-${{ hashFiles(format('{0}/**/package-lock.json', matrix.path)) }}
          restore-keys: |
            ${{ runner.os }}-node-24-
            ${{ runner.os }}-node-

      - name: Record platform toolchain versions
        run: |
          set -euo pipefail
          {
            echo "platform=${{ matrix.platform }}"
            echo "runner=${{ matrix.runs_on }}"
            echo "runner_os=${{ runner.os }}"
            rustc --version || echo "rustc=absent"
            python3 --version || echo "python=absent"
            openssl version || echo "openssl=absent"
            node --version || echo "node=absent"
          } | tee "$RUNNER_TEMP/toolchain-versions.txt"

      - name: TypeScript toolchain
        if: contains(matrix.toolchains, 'typescript')
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Require an implemented executor
        run: python3 tools/ci/executor.py --language "${{ matrix.language }}"

      # Toolchains are selected by language from plugins/registry.json. Python
      # steps are added here when a Python plugin is migrated; the executor
      # guard and the pinned-Core acceptance stay shared.
      - name: Read the pinned Core contract
        id: core
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          value = json.load(open("docs/ownership.json"))
          contract = value["core_contract"]
          platforms = contract.get("platforms") or {}
          platform = os.environ["PLATFORM"]
          if platform not in platforms:
              raise SystemExit("no pinned Core mapping for platform " + platform)
          pinned = platforms[platform]
          print("repository=" + contract["repository"])
          print("release=" + contract["release"])
          print("binary=" + pinned["binary"])
          print("sha256=" + pinned["sha256"])
          print("version=" + contract["version"])
          print("source_commit=" + contract["source_commit"])
          PY

      # Cache Core runtime by platform, release, and source commit
      - name: Cache Core runtime
        id: cache-core
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
        with:
          path: ${{ runner.temp }}/core
          key: core-v2-${{ matrix.platform }}-${{ steps.core.outputs.release }}-${{ steps.core.outputs.source_commit }}

      - name: Fetch pinned Core binary and modules
        if: steps.cache-core.outputs.cache-hit != 'true'
        env:
          CORE_REPOSITORY: ${{ steps.core.outputs.repository }}
          CORE_RELEASE: ${{ steps.core.outputs.release }}
          CORE_BINARY: ${{ steps.core.outputs.binary }}
          CORE_BINARY_SHA256: ${{ steps.core.outputs.sha256 }}
          SOURCE_COMMIT: ${{ steps.core.outputs.source_commit }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/core"
          mkdir -p "$root/bin" "$root/tools/quality/schema"
          curl --fail --show-error --location --proto '=https' --tlsv1.2 \
            -o "$root/bin/$CORE_BINARY" \
            "https://github.com/${CORE_REPOSITORY}/releases/download/${CORE_RELEASE}/${CORE_BINARY}"
          actual=$(python3 -c "import hashlib,sys;print(hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest())" "$root/bin/$CORE_BINARY")
          if [ "$actual" != "$CORE_BINARY_SHA256" ]; then
            echo "pinned Core digest mismatch for $CORE_BINARY" >&2
            exit 1
          fi
          chmod +x "$root/bin/$CORE_BINARY"
          base="https://raw.githubusercontent.com/${CORE_REPOSITORY}/${SOURCE_COMMIT}"
          for name in collector_runner harness_evidence project_model quality_evidence; do
            curl --fail --show-error --location "$base/tools/quality/${name}.py" \
              -o "$root/tools/quality/${name}.py"
          done
          for name in capability-requirements harness-evidence policy-exceptions policy project-model subject-mappings; do
            curl --fail --show-error --location "$base/tools/quality/schema/${name}.schema.json" \
              -o "$root/tools/quality/schema/${name}.schema.json"
          done
          curl --fail --show-error --location "$base/schema/collector-protocol.schema.json" \
            -o "$root/tools/quality/schema/collector-protocol.schema.json"
          mkdir -p "$root/presets"
          for name in empty.audit.toml default.secrets.toml; do
            curl --fail --show-error --location "$base/tools/harness-gate/presets/${name}" \
              -o "$root/presets/${name}"
            test -s "$root/presets/${name}"
          done
          # rust-api.flow.toml is an externalized reviewed preset owned by this
          # repository; it is fetched from the workflow commit, not Core source.
          curl --fail --show-error --location \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/presets/rust-api.flow.toml" \
            -o "$root/presets/rust-api.flow.toml"
          test -s "$root/presets/rust-api.flow.toml"
          curl --fail --show-error --location "$base/tools/release/generate-sbom.py" \
            -o "$root/generate-sbom.py"
          test -s "$root/generate-sbom.py"

      - name: Select OpenSSL 3 (macOS, native plugin)
        if: runner.os == 'macOS' && matrix.plugin == 'rust-native-plugin'
        run: |
          set -euo pipefail
          prefix="$(brew --prefix openssl@3)"
          test -x "$prefix/bin/openssl"
          "$prefix/bin/openssl" version
          echo "$prefix/bin" >> "$GITHUB_PATH"

      - name: Format and lint (rust cargo)
        if: matrix.language == 'rust' && matrix.cargo_checks
        working-directory: ${{ matrix.path }}
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings

      - name: Build (rust)
        if: matrix.language == 'rust'
        working-directory: ${{ matrix.path }}
        env:
          NATIVE_SUFFIX: ${{ matrix.suffix }}
        run: ${{ matrix.entries.install }}

      - name: Merge plugin schemas into the temporary pinned schema dir
        if: matrix.language == 'rust' && matrix.merges_schemas
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/core/tools/quality/schema"
          for source in "$GITHUB_WORKSPACE/${{ matrix.path }}"/schema/*.schema.json; do
            name=$(basename "$source")
            if [ -e "$target/$name" ]; then
              # Allow duplicate schema names if content is identical
              if ! cmp -s "$source" "$target/$name"; then
                echo "schema name conflict with different content: $name" >&2
                exit 1
              fi
            else
              cp "$source" "$target/$name"
            fi
          done

      - name: Helper tests (rust)
        if: matrix.language == 'rust'
        working-directory: ${{ matrix.path }}
        run: ${{ matrix.entries.test }}

      - name: Package artifact (rust)
        if: matrix.language == 'rust'
        working-directory: ${{ matrix.path }}
        env:
          NATIVE_ASSET: ${{ matrix.asset }}
        run: ${{ matrix.entries.package }}

      - name: Fetch pinned Core consumer (rust)
        if: matrix.language == 'rust' && matrix.plugin != 'postgres-service'
        env:
          CORE_REPOSITORY: ${{ steps.core.outputs.repository }}
          SOURCE_COMMIT: ${{ steps.core.outputs.source_commit }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/core"
          mkdir -p "$root/tools/quality"
          base="https://raw.githubusercontent.com/${CORE_REPOSITORY}/${SOURCE_COMMIT}"
          for name in source_measure function_risk production_coverage complexity_analyzer quality_evidence quality_common; do
            curl --fail --show-error --location "$base/tools/quality/${name}.py" \
              -o "$root/tools/quality/${name}.py"
          done

      - name: Contract acceptance against the pinned Core consumer (rust)
        if: matrix.language == 'rust'
        working-directory: ${{ matrix.path }}
        env:
          NATIVE_ASSET: ${{ matrix.asset }}
          NATIVE_SUFFIX: ${{ matrix.suffix }}
          CORE_ASSET: ${{ steps.core.outputs.binary }}
        run: ${{ matrix.entries.contract }}

      - name: Build and install (python)
        if: matrix.language == 'python'
        working-directory: ${{ matrix.path }}
        run: ${{ matrix.entries.install }}

      - name: Unit and protocol tests (python)
        if: matrix.language == 'python'
        working-directory: ${{ matrix.path }}
        run: ${{ matrix.entries.test }}

      - name: Contract acceptance against the pinned Core (python)
        if: matrix.language == 'python'
        working-directory: ${{ matrix.path }}
        run: ${{ matrix.entries.contract }}

      - name: Package (python)
        if: matrix.language == 'python'
        working-directory: ${{ matrix.path }}
        run: ${{ matrix.entries.package }}

      - name: Install dependencies (typescript)
        if: matrix.language == 'typescript'
        working-directory: ${{ matrix.path }}
        run: ${{ matrix.entries.install }}

      - name: Unit and protocol tests (typescript)
        if: matrix.language == 'typescript'
        working-directory: ${{ matrix.path }}
        run: ${{ matrix.entries.test }}

      - name: Contract acceptance against the pinned Core
        if: matrix.language == 'typescript'
        working-directory: ${{ matrix.path }}
        env:
          HARNESS_GATE_BINARY: ${{ runner.temp }}/core/bin/${{ steps.core.outputs.binary }}
          HARNESS_GATE_EXPECTED_VERSION: ${{ steps.core.outputs.version }}
          PYTHONPATH: ${{ runner.temp }}/core/tools/quality
        run: ${{ matrix.entries.contract }}

      - name: Pack and clean-install (typescript)
        if: matrix.language == 'typescript'
        working-directory: ${{ matrix.path }}
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/consumer-${{ matrix.plugin }}"
          pack="$RUNNER_TEMP/pack-${{ matrix.plugin }}"
          mkdir -p "$pack" "$prefix"
          ${{ matrix.entries.package }} --json --pack-destination "$pack" > "$pack.json"
          archive=$(python3 -c "import json; print(json.load(open('$pack.json'))[0]['filename'])")
          name=$(node -p "Object.keys(require('./package.json').bin)[0]")
          version=$(node -p "require('./package.json').version")
          printf '{"name":"gateprobes-consumer","version":"0.0.0","private":true}\n' \
            > "$prefix/package.json"
          npm install --ignore-scripts --omit=dev --prefix "$prefix" "$pack/$archive"
          installed=$("$prefix/node_modules/.bin/$name" --version)
          echo "installed: $installed"
          case "$installed" in
            *"$version"*) ;;
            *) echo "unexpected installed version: $installed" >&2; exit 1 ;;
          esac

  presets:
    name: External preset compatibility
    needs: classify
    if: needs.classify.outputs.run_plugins == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.97.1'
      
      # Cache Cargo for postgres-service build
      - name: Cache Cargo registry
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-1.97.1-${{ hashFiles('plugins/postgres-service/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-1.97.1-
            ${{ runner.os }}-cargo-
      
      - name: Cache postgres-service build
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
        with:
          path: plugins/postgres-service/target
          key: ${{ runner.os }}-postgres-service-${{ hashFiles('plugins/postgres-service/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-postgres-service-
      
      - name: Prepare the installed Postgres binding without changing frozen seeds
        run: |
          set -euo pipefail
          cargo build --locked --release --manifest-path plugins/postgres-service/Cargo.toml
          python3 plugins/postgres-service/prepare-preset.py \
            --binary "$GITHUB_WORKSPACE/plugins/postgres-service/target/release/gateprobes-postgres" \
            --output "$RUNNER_TEMP/postgres-presets"
      
      # Read Core contract for cache key
      - name: Read Core contract
        id: core
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          value = json.load(open('docs/ownership.json'))
          contract = value['core_contract']
          print(f"release={contract['release']}")
          print(f"source_commit={contract['source_commit']}")
          PY

      # Cache Core runtime (Linux only for presets job)
      - name: Cache Core runtime
        id: cache-core
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
        with:
          path: ${{ runner.temp }}/core-dist
          key: core-v2-linux-${{ steps.core.outputs.release }}-${{ steps.core.outputs.source_commit }}
      
      # Download Core if cache miss (Linux binary only)
      - name: Fetch and prepare Core
        if: steps.cache-core.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          python3 tools/release/pinned_core.py --output "$RUNNER_TEMP/core-dist"
      
      - name: Verify migrated templates against the fixed released Core
        run: |
          set -euo pipefail
          chmod +x "$RUNNER_TEMP/core-dist/bin/"*
          python3 tools/presets/accept.py --core "$RUNNER_TEMP/core-dist/bin/$(ls $RUNNER_TEMP/core-dist/bin/)" --external \
            --presets-dir "$RUNNER_TEMP/postgres-presets"

  compatibility:
    name: Legacy compatibility ownership
    needs: classify
    if: needs.classify.outputs.run_plugins == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HANDOFF_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
      # Existing opt-in textual MIR experiment, exact original compiler.
      # This is not stable candidate promotion or bundled-runtime publication.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.97.1'
          components: llvm-tools-preview
      
      # Cache Cargo for compatibility tests
      - name: Cache Cargo registry
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-1.97.1-compat-${{ hashFiles('compatibility/**/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-1.97.1-compat-
            ${{ runner.os }}-cargo-1.97.1-
      
      - name: Restore verified historical replay data
        run: python3 compatibility/legacy-core/snapshot/tools/maintenance/test_data.py --group quality-history --group regression-corpus
      - name: Preserve original tests and prove Core fixture parity
        run: python3 compatibility/legacy-core/run.py --report "$RUNNER_TEMP/legacy-compatibility.json"
      - name: Retain original compatibility result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: legacy-core-compatibility
          path: ${{ runner.temp }}/legacy-compatibility.json
          if-no-files-found: error
          retention-days: 7

  required_aggregate:
    name: Required Quality Aggregate
    if: ${{ always() }}
    needs: [ classify, lightweight, runtime-wire, runtime-repro, runtime-import-joint, runtime-importer, runtime-import-v3, runtime-import-lifecycle, runtime-import-podman, plugins, presets, compatibility ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Require selected compatibility acceptance
        env:
          SELECTED: ${{ needs.classify.outputs.run_plugins }}
          RESULT: ${{ needs.compatibility.result }}
        run: |
          python3 - <<'PY'
          import os
          selected, result = os.environ['SELECTED'], os.environ['RESULT']
          if selected not in ('true', 'false') or (selected == 'true' and result != 'success') or (selected == 'false' and result not in ('success', 'skipped')):
              raise SystemExit('required compatibility acceptance missing or failed')
          PY
      - name: Require selected independent runtime comparison
        env:
          SELECTED: ${{ needs.classify.outputs.run_light }}
          RESULT: ${{ needs.runtime-repro.result }}
        run: |
          python3 - <<'PYREQUIRED'
          import os
          selected, result = os.environ['SELECTED'], os.environ['RESULT']
          if selected not in ('true', 'false') or (selected == 'true' and result != 'success') or (selected == 'false' and result not in ('success', 'skipped')):
              raise SystemExit('independent runtime comparison missing or failed')
          PYREQUIRED
      - name: Require selected installed runtime acceptance
        env:
          SELECTED: ${{ needs.classify.outputs.run_light }}
          RESULT: ${{ needs.runtime-import-joint.result }}
        run: |
          python3 - <<'PYJOINT'
          import os
          selected, result = os.environ['SELECTED'], os.environ['RESULT']
          if selected not in ('true', 'false') or (selected == 'true' and result != 'success') or (selected == 'false' and result not in ('success', 'skipped')):
              raise SystemExit('installed runtime acceptance missing or failed')
          PYJOINT
      - name: Require standalone importer acceptance
        env:
          SELECTED: ${{ needs.classify.outputs.run_light }}
          RESULT: ${{ needs.runtime-importer.result }}
        run: |
          python3 - <<'PYIMPORTER'
          import os
          selected, result = os.environ['SELECTED'], os.environ['RESULT']
          if selected not in ('true', 'false') or (selected == 'true' and result != 'success') or (selected == 'false' and result not in ('success', 'skipped')):
              raise SystemExit('standalone importer acceptance missing or failed')
          PYIMPORTER
      - name: Require v3 importer acceptance
        env:
          SELECTED: ${{ needs.classify.outputs.run_light }}
          RESULT: ${{ needs.runtime-import-v3.result }}
        run: |
          python3 - <<'PYV3'
          import os
          selected, result = os.environ['SELECTED'], os.environ['RESULT']
          if selected not in ('true', 'false') or (selected == 'true' and result != 'success') or (selected == 'false' and result not in ('success', 'skipped')):
              raise SystemExit('v3 importer acceptance missing or failed')
          PYV3
      - name: Require lifecycle importer acceptance
        env:
          SELECTED: ${{ needs.classify.outputs.run_light }}
          RESULT: ${{ needs.runtime-import-lifecycle.result }}
        run: |
          python3 - <<'PYLIFECYCLE'
          import os
          selected, result = os.environ['SELECTED'], os.environ['RESULT']
          if selected not in ('true', 'false') or (selected == 'true' and result != 'success') or (selected == 'false' and result not in ('success', 'skipped')):
              raise SystemExit('lifecycle importer acceptance missing or failed')
          PYLIFECYCLE
      - name: Require Podman importer acceptance
        env:
          SELECTED: ${{ needs.classify.outputs.run_light }}
          RESULT: ${{ needs.runtime-import-podman.result }}
        run: |
          python3 - <<'PYPODMAN'
          import os
          selected, result = os.environ['SELECTED'], os.environ['RESULT']
          if selected not in ('true', 'false') or (selected == 'true' and result != 'success') or (selected == 'false' and result not in ('success', 'skipped')):
              raise SystemExit('Podman importer acceptance missing or failed')
          PYPODMAN
      - name: Require every selected task to succeed
        run: |
          set -euo pipefail
          python3 tools/ci/aggregate.py \
            --classify-result "${{ needs.classify.result }}" \
            --run-light "${{ needs.classify.outputs.run_light }}" \
            --run-plugins "${{ needs.classify.outputs.run_plugins }}" \
            --light-result "${{ needs.lightweight.result }}" \
            --runtime-wire-result "${{ needs.runtime-wire.result }}" \
            --plugins-result "${{ needs.plugins.result }}" \
            --presets-result "${{ needs.presets.result }}"
