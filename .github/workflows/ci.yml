name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    name: Classify change
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_docs: ${{ steps.classify.outputs.run_docs }}
      run_typescript_risk: ${{ steps.classify.outputs.run_typescript_risk }}
      summary: ${{ steps.classify.outputs.summary }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Classifier self-tests
        run: python3 -m unittest discover -s tools/ci/tests -v

      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE"; HEAD="${{ github.sha }}"
          elif [ "$EVENT_NAME" = "push" ]; then
            BASE="$PUSH_BEFORE"; HEAD="$PUSH_AFTER"
          else
            BASE=""; HEAD=""
          fi
          python3 tools/ci/classify.py --base "$BASE" --head "$HEAD" \
            --github-output "$GITHUB_OUTPUT"

  docs:
    name: Documentation checks
    needs: classify
    if: needs.classify.outputs.run_docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check links, declarations and forbidden artifacts
        run: python3 tools/ci/check_docs.py

  typescript_risk:
    name: TypeScript-risk plugin
    needs: classify
    if: needs.classify.outputs.run_typescript_risk == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Read the pinned Core contract
        id: core
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          value = json.load(open("docs/ownership.json"))
          contract = value["core_contract"]
          print("release=" + contract["release"])
          print("binary=" + contract["binary"])
          print("sha256=" + contract["sha256"])
          print("version=" + contract["version"])
          print("source_commit=" + value["source_commit"])
          PY

      - name: Install and unit-test the plugin
        working-directory: plugins/typescript-risk
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm test

      - name: Fetch pinned Core binary and reference transport
        env:
          CORE_RELEASE: ${{ steps.core.outputs.release }}
          CORE_BINARY: ${{ steps.core.outputs.binary }}
          CORE_BINARY_SHA256: ${{ steps.core.outputs.sha256 }}
          SOURCE_COMMIT: ${{ steps.core.outputs.source_commit }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/core"
          mkdir -p "$root/bin" "$root/tools/quality/schema"
          curl --fail --show-error --location --proto '=https' --tlsv1.2 \
            -o "$root/bin/$CORE_BINARY" \
            "https://github.com/musutrade/Harness-Gate/releases/download/${CORE_RELEASE}/${CORE_BINARY}"
          echo "${CORE_BINARY_SHA256}  $root/bin/$CORE_BINARY" | sha256sum --check
          chmod +x "$root/bin/$CORE_BINARY"
          base="https://raw.githubusercontent.com/musutrade/Harness-Gate/${SOURCE_COMMIT}"
          for name in collector_runner harness_evidence project_model quality_evidence; do
            curl --fail --show-error --location "$base/tools/quality/${name}.py" \
              -o "$root/tools/quality/${name}.py"
          done
          for name in capability-requirements harness-evidence policy-exceptions policy project-model subject-mappings; do
            curl --fail --show-error --location "$base/tools/quality/schema/${name}.schema.json" \
              -o "$root/tools/quality/schema/${name}.schema.json"
          done
          curl --fail --show-error --location "$base/schema/collector-protocol.schema.json" \
            -o "$root/tools/quality/schema/collector-protocol.schema.json"

      - name: Contract acceptance against the pinned Core
        working-directory: plugins/typescript-risk
        env:
          HARNESS_GATE_BINARY: ${{ runner.temp }}/core/bin/${{ steps.core.outputs.binary }}
          HARNESS_GATE_EXPECTED_VERSION: ${{ steps.core.outputs.version }}
          PYTHONPATH: ${{ runner.temp }}/core/tools/quality
        run: npm run test:core

      - name: Pack and clean-install
        working-directory: plugins/typescript-risk
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pack" "$RUNNER_TEMP/consumer"
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP/pack" > "$RUNNER_TEMP/pack.json"
          archive=$(python3 -c "import json; print(json.load(open('$RUNNER_TEMP/pack.json'))[0]['filename'])")
          printf '{"name":"gateprobes-consumer","version":"0.0.0","private":true}\n' \
            > "$RUNNER_TEMP/consumer/package.json"
          npm install --ignore-scripts --omit=dev --prefix "$RUNNER_TEMP/consumer" \
            "$RUNNER_TEMP/pack/$archive"
          installed=$("$RUNNER_TEMP/consumer/node_modules/.bin/harness-gate-typescript-collector" --version)
          echo "installed: $installed"
          case "$installed" in
            *0.1.0-rc.4*) ;;
            *) echo "unexpected installed version: $installed" >&2; exit 1 ;;
          esac

  quality_required:
    name: Required Quality Aggregate
    if: ${{ always() }}
    needs: [ classify, docs, typescript_risk ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every selected task to succeed
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          RUN_DOCS: ${{ needs.classify.outputs.run_docs }}
          RUN_TYPESCRIPT_RISK: ${{ needs.classify.outputs.run_typescript_risk }}
          DOCS_RESULT: ${{ needs.docs.result }}
          TYPESCRIPT_RISK_RESULT: ${{ needs.typescript_risk.result }}
        run: |
          set -euo pipefail
          if [ "$CLASSIFY_RESULT" != "success" ]; then
            echo "classification did not succeed: $CLASSIFY_RESULT"
            exit 1
          fi
          fail=0
          require() {
            local selected="$1" result="$2" name="$3"
            if [ "$selected" = "true" ]; then
              if [ "$result" != "success" ]; then
                echo "${name} selected but ${result}"
                fail=1
              else
                echo "${name} passed"
              fi
            else
              echo "${name} not selected; skip allowed"
            fi
          }
          require "$RUN_DOCS" "$DOCS_RESULT" docs
          require "$RUN_TYPESCRIPT_RISK" "$TYPESCRIPT_RISK_RESULT" typescript-risk
          [ "$fail" -eq 0 ]
