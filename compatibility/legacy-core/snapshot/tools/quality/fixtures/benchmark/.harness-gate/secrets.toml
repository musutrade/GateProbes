version = 2

[placeholders]
minimum_unique_characters = 4
maximum_nonalphanumeric_characters = 2
prefixes = ["${", "{{", "<"]
markers = ["example", "placeholder", "change-me"]
exact = ["password", "secret"]

[[rules]]
id = "provider-token"
kind = "direct"
pattern = '''github_pat_[A-Za-z0-9_]{20,}'''
