version = 2

[project]
name = "angular-rust-app"
default_profile = "full"
hook_profile = "hook"

[paths]
reports = ".harness-gate/reports"
audit_config = ".harness-gate/audit.toml"
secrets_config = ".harness-gate/secrets.toml"

[paths.aliases.backend]
path = "backend"

[paths.aliases.frontend]
path = "frontend"

[policy]
required_steps = ["backend.format", "backend.clippy", "backend.compile", "backend.tests", "frontend.lint", "frontend.tests", "frontend.build"]

[[doctor.checks]]
id = "tool.git"
label = "git"
kind = "command"
program = "git"
args = ["--version"]

[[doctor.checks]]
id = "tool.cargo"
label = "cargo"
kind = "command"
program = "cargo"
args = ["--version"]

[[doctor.checks]]
id = "tool.node"
label = "node"
kind = "command"
program = "node"
args = ["--version"]

[[doctor.checks]]
id = "tool.npm"
label = "npm"
kind = "command"
program = "npm"
args = ["--version"]

[[doctor.checks]]
id = "frontend.dependencies"
label = "frontend dependencies"
kind = "path"
path = "{frontend}/node_modules"
path_type = "directory"
help = "run `cd frontend && npm ci`"

[[doctor.checks]]
id = "test.database"
label = "test database"
required = false
kind = "service"
service = "test-postgres"
help = "configure TEST_DATABASE_URL or Docker"

[services.test-postgres]
kind = "docker"
image = "postgres:16-alpine"
external_env = "TEST_DATABASE_URL"
inject_env = "TEST_DATABASE_URL"
external_value_policy = "isolated-postgres"
startup_timeout_secs = 30
container_port = 5432
environment = { POSTGRES_USER = "app_test", POSTGRES_PASSWORD = "app_test", POSTGRES_DB = "app_test" }
healthcheck = ["pg_isready", "-h", "127.0.0.1", "-U", "app_test", "-d", "app_test"]
connection = "postgres://app_test:app_test@127.0.0.1:{host_port}/app_test"

[parsers.rust]
kind = "regex"
patterns = ['(?m)^running ([0-9]+) tests?$']
capture = 1
minimum = 1

[parsers.angular]
kind = "regex"
patterns = ['Tests\s+([0-9]+) passed']
capture = 1
minimum = 1

[scope]
unmatched = "all"

[[scope.rules]]
patterns = ["backend/**"]
components = ["backend"]

[[scope.rules]]
patterns = ["frontend/**"]
components = ["frontend"]

[[scope.rules]]
patterns = [".harness-gate/**"]
components = ["backend", "frontend"]

[[steps]]
id = "backend.format"
label = "backend format"
component = "backend"
profiles = ["full", "ci", "hook"]
program = "cargo"
args = ["fmt", "--manifest-path", "{backend}/Cargo.toml", "--", "--check"]
cwd = "{root}"
log = "backend_fmt.log"
timeout_secs = 180

[[steps]]
id = "backend.clippy"
label = "backend Clippy"
component = "backend"
profiles = ["full", "ci", "hook"]
program = "cargo"
args = ["clippy", "--manifest-path", "{backend}/Cargo.toml", "--all-targets", "--all-features", "--", "-D", "warnings"]
cwd = "{root}"
log = "backend_clippy.log"
timeout_secs = 300

[[steps]]
id = "backend.compile"
label = "backend compile"
component = "backend"
profiles = ["full", "ci"]
program = "cargo"
args = ["check", "--manifest-path", "{backend}/Cargo.toml", "--all-targets"]
cwd = "{root}"
log = "backend_check.log"
timeout_secs = 300

[[steps]]
id = "backend.tests"
label = "backend tests"
component = "backend"
profiles = ["full", "ci"]
program = "cargo"
args = ["test", "--manifest-path", "{backend}/Cargo.toml", "--", "--nocapture"]
cwd = "{root}"
log = "backend_tests.log"
timeout_secs = 300
parser = "rust"
services = ["test-postgres"]
remove_env = ["DATABASE_URL"]

[[steps]]
id = "frontend.lint"
label = "frontend lint"
component = "frontend"
profiles = ["full", "ci", "hook"]
program = "npm"
args = ["run", "lint"]
cwd = "{frontend}"
log = "frontend_lint.log"
timeout_secs = 180

[[steps]]
id = "frontend.tests"
label = "frontend tests"
component = "frontend"
profiles = ["full", "ci"]
program = "npm"
args = ["test", "--", "--watch=false", "--runner=vitest"]
cwd = "{frontend}"
log = "frontend_tests.log"
timeout_secs = 300
parser = "angular"

[[steps]]
id = "frontend.build"
label = "frontend production build"
component = "frontend"
profiles = ["full", "ci"]
program = "npm"
args = ["run", "build"]
cwd = "{frontend}"
log = "frontend_build.log"
timeout_secs = 300
