version = 2

[placeholders]
minimum_unique_characters = 4
maximum_nonalphanumeric_characters = 2
prefixes = ["${", "{{", "<"]
markers = [
  "change-me",
  "changeme",
  "replace-me",
  "replace_me",
  "placeholder",
  "example",
  "your-",
  "your_",
  "dummy",
  "not-a-secret",
  "not_a_secret",
  "secret-here",
  "secret_here",
  "for-testing",
  "for_testing",
]
exact = [
  "postgres",
  "password",
  "secret",
  "admin",
  "test-password",
  "local-password",
]

[[rules]]
id = "provider-token"
kind = "direct"
pattern = '''github_pat_[A-Za-z0-9_]{20,}|gh[pousr]_[A-Za-z0-9]{20,}|glpat-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|npm_[A-Za-z0-9]{36}|eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}|https?://[^/@\s]+:[^@\s]+@[^\s]+|https://hooks\.slack\.com/services/[A-Za-z0-9_-]{8,}/[A-Za-z0-9_-]{8,}/[A-Za-z0-9_-]{20,}|-----BEGIN ([A-Z0-9 ]+ )?PRIVATE KEY-----'''

[[rules]]
id = "named-secret"
kind = "value"
pattern = '''(?ix)
  \b(?:
    jwt_(?:secret|signing_(?:key|secret)|encryption_key) |
    (?:access_|refresh_)?token_secret |
    session_secret |
    cookie_secret |
    auth_secret |
    (?:wecom|wechat_work|weixin|dingtalk|ding_talk)[a-z0-9_]*(?:secret|token|key) |
    [a-z0-9_]*webhook_(?:secret|token|key)
  )\b
  (?:
    ["']?\s*[:=]\s*["']? |
    \s*:\s*[^=\r\n]{1,40}=\s*["']?
  )
  ([A-Za-z0-9][A-Za-z0-9._~+/=-]{7,})
'''
capture = 1
minimum_length = 12

[[rules]]
id = "postgres-credentials"
kind = "postgres-url"
pattern = '''(?ix)
  \bpostgres(?:ql)?://
  ([^:/@\s"'<>]+):
  ([^@/\s"'<>]+)@
  (\[[^\]]+\]|[^:/\s"'<>]+)
  (?::[^/\s"'<>]+)?
  /([A-Za-z0-9_.-]+)
'''
username_capture = 1
password_capture = 2
host_capture = 3
database_capture = 4
minimum_length = 8
local_test_policy = { hosts = ["localhost", "127.0.0.1", "::1", "[::1]"], database_suffixes = ["_test", "-test"], require_username_equals_password = true }

[[rules]]
id = "secret-bearing-webhook-url"
kind = "webhook-url"
pattern = '''(?ix)
  \b[a-z0-9_]*(?:webhook|callback)(?:_url)?\b
  ["']?\s*[:=]\s*["']?
  (https?://[^\s"'<>]+)
'''
capture = 1
query_parameters = ["key", "token", "access_token", "secret", "signature", "sig"]
query_minimum_length = 12
path_minimum_length = 20

[[rules]]
id = "wecom-webhook"
kind = "value"
pattern = '''(?i)https://qyapi\.weixin\.qq\.com/cgi-bin/webhook/send\?key=([A-Za-z0-9_-]{16,})'''
capture = 1
minimum_length = 16

[[rules]]
id = "dingtalk-webhook"
kind = "value"
pattern = '''(?i)https://(?:oapi|api)\.dingtalk\.com/[^\s"'<>]*[?&]access_token=([A-Za-z0-9_-]{16,})'''
capture = 1
minimum_length = 16
