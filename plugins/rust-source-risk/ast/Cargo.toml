[package]
name = "harness-gate-rust-source-inventory"
version = "0.1.0-rc.2"
edition = "2024"
publish = false
license = "MIT"

[workspace]

[dependencies]
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
syn = { version = "=2.0.119", features = ["full", "visit", "parsing"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
