[package]
name = "gateprobes-operator"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
sha2 = "0.10"
tempfile = "3.27"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
[lints.clippy]
cognitive_complexity = "warn"
